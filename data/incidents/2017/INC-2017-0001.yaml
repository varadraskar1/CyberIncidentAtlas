incident_id: INC-2017-0001

title: "Equifax 2017 Data Breach"

status: confirmed

dates:
  intrusion_start: "2017-05-13"
  discovered: "2017-07-29"
  disclosed: "2017-09-07"

victim:
  organization: "Equifax Inc."
  country: "US"
  sector: "Financial Services"
  organization_type: "Credit Reporting Agency"

incident_type:
  - data_breach
  - unauthorized_access
  - data_exfiltration

attack:
  initial_access:
    - "Exploitation of internet-facing web application"
    - "Apache Struts vulnerability"

  attack_vectors:
    - "Remote code execution"
    - "Exploitation of vulnerable Apache Struts component"

  mitre_attack_techniques:
    - "T1190"

impact:
  data_compromised:
    - "Names"
    - "Dates of birth"
    - "Social Security numbers"
    - "Physical addresses"
    - "Driver's license numbers"
    - "Payment card numbers"
    - "Credit dispute documents"

  records_affected: 145500000

  financial_impact: null

  financial_currency: null

  operational_impact: "Equifax took the affected online dispute portal offline after detecting suspicious activity."

threat_actors: []

vulnerabilities:
  - "CVE-2017-5638"

malware: []

timeline:
  - date: "2017-03-08"
    event: "Equifax received a U.S. CERT alert regarding a critical Apache Struts vulnerability."

  - date: "2017-03-09"
    event: "Equifax circulated the vulnerability notification internally."

  - date: "2017-05-13"
    event: "Attackers gained access to Equifax systems through the online dispute portal."

  - date: "2017-07-29"
    event: "Equifax detected suspicious traffic associated with the online dispute portal."

  - date: "2017-07-30"
    event: "Equifax observed additional suspicious activity and took the affected portal offline."

  - date: "2017-08-02"
    event: "Equifax hired cybersecurity and forensic experts and notified the FBI."

  - date: "2017-09-07"
    event: "Equifax publicly disclosed the data breach."

root_cause:
  - "Failure to patch a known critical Apache Struts vulnerability."
  - "Incomplete asset inventory prevented Equifax from identifying the vulnerable system."
  - "Vulnerability scanning failed to identify the vulnerable Apache Struts installation."
  - "Insufficient network segmentation allowed attackers to access additional databases."
  - "Plaintext credentials stored on an internal file share enabled access to additional systems."
  - "Insufficient intrusion detection capabilities delayed detection."

response:
  - "Affected online dispute portal was taken offline."
  - "Cybersecurity and forensic experts were engaged."
  - "The FBI was notified."
  - "Equifax initiated an investigation into the scope and impact of the breach."
  - "Equifax implemented security improvements following the incident."
  - "A global regulatory settlement was reached in 2019."

lessons_learned:
  - "Critical vulnerabilities on internet-facing systems require rapid remediation."
  - "Asset inventories must accurately identify software and systems exposed to vulnerabilities."
  - "Network segmentation can limit the impact of a compromised application."
  - "Credentials should not be stored in plaintext."
  - "Security monitoring must provide visibility into critical network traffic."
  - "Vulnerability scanning should be validated rather than treated as proof that systems are secure."

